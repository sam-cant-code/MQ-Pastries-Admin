<div class="flex h-screen bg-gray-50 overflow-hidden font-sans">
  <!-- Mobile Sidebar Overlay -->
  <div *ngIf="isSidebarOpen" class="fixed inset-0 z-40 bg-gray-900/80 md:hidden backdrop-blur-sm transition-opacity" (click)="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside [ngClass]="isSidebarOpen ? 'translate-x-0' : '-translate-x-full'" class="fixed inset-y-0 left-0 z-50 w-64 bg-espresso-900 text-white flex flex-col transition-transform duration-300 ease-in-out md:relative md:translate-x-0 shrink-0 shadow-2xl md:shadow-none">
    <div class="h-16 flex items-center justify-between px-6 border-b border-espresso-800">
      <div class="flex items-center gap-3">
        <img src="/logo.png" alt="Logo" class="w-8 h-8 rounded-full border border-cream-50/30 object-cover bg-white">
        <span class="text-xl font-serif tracking-widest uppercase text-cream-50">MQ Admin</span>
      </div>
      <!-- Close button for mobile -->
      <button (click)="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <nav class="flex-1 overflow-y-auto py-4">
      <ul class="space-y-1">
        <li>
          <a routerLink="/overview" routerLinkActive="bg-espresso-800 border-l-4 border-caramel-500 text-white" (click)="isSidebarOpen = false" class="flex items-center px-6 py-3 text-cream-100 hover:bg-espresso-800 hover:text-white transition-colors border-l-4 border-transparent">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Overview
          </a>
        </li>
        <li>
          <a routerLink="/products" routerLinkActive="bg-espresso-800 border-l-4 border-caramel-500 text-white" (click)="isSidebarOpen = false" class="flex items-center px-6 py-3 text-cream-100 hover:bg-espresso-800 hover:text-white transition-colors border-l-4 border-transparent">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            Products
          </a>
        </li>
        <li>
          <a routerLink="/categories" routerLinkActive="bg-espresso-800 border-l-4 border-caramel-500 text-white" (click)="isSidebarOpen = false" class="flex items-center px-6 py-3 text-cream-100 hover:bg-espresso-800 hover:text-white transition-colors border-l-4 border-transparent pl-12 text-sm">
            <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
            Categories
          </a>
        </li>
        <li>
          <a routerLink="/orders" routerLinkActive="bg-espresso-800 border-l-4 border-caramel-500 text-white" (click)="isSidebarOpen = false" class="flex items-center px-6 py-3 text-cream-100 hover:bg-espresso-800 hover:text-white transition-colors border-l-4 border-transparent">
            <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            Orders
          </a>
        </li>
      </ul>
    </nav>
    <div class="p-4 border-t border-espresso-800">
      <a href="#" (click)="onSignOut($event)" class="flex items-center px-4 py-2 text-sm text-cream-100 hover:text-white">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Sign Out
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Header -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0">
      <div class="flex items-center md:hidden gap-3">
        <button (click)="toggleSidebar()" class="text-gray-500 hover:text-espresso-900 focus:outline-none transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <img src="/logo.png" alt="Logo" class="w-8 h-8 rounded-full border border-gray-200 object-cover bg-white">
      </div>
      <div class="flex-1 flex justify-end items-center space-x-4">
        <div class="text-sm font-medium text-gray-700">Admin User</div>
        <div class="w-8 h-8 rounded-full bg-caramel-500 text-white flex items-center justify-center font-bold text-sm shadow-sm">
          A
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <div class="flex-1 overflow-y-auto p-8 bg-gray-50">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
