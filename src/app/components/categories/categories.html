<div>
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900 font-serif">Categories</h1>
    <button (click)="openModal()" class="bg-espresso-900 text-white px-4 py-2 rounded-sm text-sm font-medium hover:bg-espresso-800 transition-colors shadow-sm">
      + Add Category
    </button>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading()" class="flex justify-center py-10">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-caramel-500"></div>
  </div>

  <!-- Mobile Cards View -->
  <div *ngIf="!isLoading()" class="md:hidden grid grid-cols-1 gap-4">
    <div *ngIf="categories().length === 0" class="bg-white rounded-md p-6 text-center text-gray-500 shadow-sm border border-gray-100">
      No categories found.
    </div>
    <div *ngFor="let category of categories()" (click)="openModal(category)" class="bg-white rounded-md shadow-sm border border-gray-100 p-4 flex flex-col gap-3 relative cursor-pointer hover:bg-gray-50 transition-colors">
      <div>
        <div class="text-sm font-bold text-gray-900">{{ category.name }}</div>
        <div class="text-xs text-gray-500 mt-1">{{ category.description || 'No description' }}</div>
      </div>
      <div class="flex justify-end pt-3 border-t border-gray-100">
        <div class="flex space-x-4 text-sm font-medium">
          <button (click)="deleteCategory($event, category.id!)" class="text-red-600 hover:text-red-900 bg-red-50 px-3 py-1 rounded">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Desktop Table View -->
  <div *ngIf="!isLoading()" class="hidden md:block bg-white rounded-md shadow-sm border border-gray-100 overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
          <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngIf="categories().length === 0">
          <td colspan="3" class="px-6 py-8 text-center text-gray-500">
            No categories found.
          </td>
        </tr>
        <tr *ngFor="let category of categories()" (click)="openModal(category)" class="cursor-pointer hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ category.name }}</td>
          <td class="px-6 py-4 text-sm text-gray-500">{{ category.description }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button (click)="deleteCategory($event, category.id!)" class="text-red-600 hover:text-red-900">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Create/Edit Modal -->
  <div *ngIf="isModalOpen" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">

      <!-- Background overlay -->
      <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" (click)="closeModal()"></div>
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

      <!-- Modal panel -->
      <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
        <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
          <div class="bg-gray-50 px-4 pt-5 pb-4 sm:p-6 sm:pb-4 border-b border-gray-200">
            <h3 class="text-xl leading-6 font-medium text-gray-900 font-serif" id="modal-title">
              {{ isEditMode ? 'Edit Category' : 'Add New Category' }}
            </h3>
          </div>
          <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
            <div class="space-y-4">
              <div>
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" formControlName="name" class="mt-1 focus:ring-caramel-500 focus:border-caramel-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md p-2 border">
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700">Description</label>
                <textarea formControlName="description" rows="3" class="mt-1 focus:ring-caramel-500 focus:border-caramel-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md p-2 border"></textarea>
              </div>
            </div>
          </div>
          <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse border-t border-gray-200">
            <button type="submit" [disabled]="categoryForm.invalid" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-espresso-900 text-base font-medium text-white hover:bg-espresso-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-caramel-500 sm:ml-3 sm:w-auto sm:text-sm disabled:opacity-50">
              {{ isEditMode ? 'Save Changes' : 'Create Category' }}
            </button>
            <button type="button" (click)="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-caramel-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
