<div class="min-h-screen flex items-center justify-center bg-cream-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 shadow-2xl rounded-sm border border-cream-200">
    <div>
      <h2 class="mt-2 text-center text-3xl font-bold tracking-tight text-espresso-900">
        Reset Password
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Create a new, secure password for your account.
      </p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="bg-red-50 border-l-4 border-red-500 p-4 mb-4">
      <div class="flex">
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ errorMessage }}</p>
        </div>
      </div>
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="bg-green-50 border-l-4 border-green-500 p-4 mb-4">
      <div class="flex">
        <div class="ml-3">
          <p class="text-sm text-green-700">{{ successMessage }}</p>
        </div>
      </div>
      <div class="mt-4 text-center">
        <a routerLink="/login" class="font-semibold text-caramel-600 hover:text-caramel-500">Go to Login</a>
      </div>
    </div>

    <form *ngIf="!successMessage" [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="mt-8 space-y-6">
      <div class="-space-y-px rounded-md shadow-sm">
        <div>
          <label for="new-password" class="sr-only">New Password</label>
          <input id="new-password" formControlName="newPassword" type="password" required class="relative block w-full rounded-t-md border-0 py-3 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:z-10 focus:ring-2 focus:ring-inset focus:ring-caramel-500 sm:text-sm sm:leading-6" placeholder="New Password">
        </div>
        <div>
          <label for="confirm-password" class="sr-only">Confirm Password</label>
          <input id="confirm-password" formControlName="confirmPassword" type="password" required class="relative block w-full rounded-b-md border-0 py-3 px-3 text-gray-900 ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:z-10 focus:ring-2 focus:ring-inset focus:ring-caramel-500 sm:text-sm sm:leading-6" placeholder="Confirm Password">
        </div>
      </div>
      
      <div *ngIf="resetForm.errors?.['mismatch'] && resetForm.get('confirmPassword')?.touched" class="text-red-500 text-sm">
        Passwords do not match.
      </div>

      <div>
        <button type="submit" [disabled]="resetForm.invalid || isLoading || !token" class="group relative flex w-full justify-center rounded-sm bg-espresso-900 py-3 px-3 text-sm font-semibold text-white hover:bg-espresso-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-espresso-900 transition-colors disabled:opacity-50">
          <span *ngIf="isLoading">Resetting...</span>
          <span *ngIf="!isLoading">Reset Password</span>
        </button>
      </div>
      <div class="text-center text-sm">
        <a routerLink="/login" class="text-gray-500 hover:text-gray-700">Back to Login</a>
      </div>
    </form>
  </div>
</div>
